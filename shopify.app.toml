# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration

client_id = "565e7c02bd2f63f9f5c424eac4ea4e20"
name = "Luca AI Shopping Assistant"
application_url = "https://primal-shopify-app.vercel.app"
embedded = true

[build]
automatically_update_urls_on_dev = true

[webhooks]
# App-specific subscriptions use this version. aura-shopify's REST-registered subscriptions
# inherit it too: on staging (6 Oct 2026) they delivered 2025-10 payloads although the backend
# registers them through the 2026-07 Admin URL. Shopify's docs disagree about GraphQL-created
# ones (the backend's METAOBJECTS_* etc.); none has delivered yet, so read their
# X-Shopify-API-Version header. 2025-10 is retired on 2026-10-16; Shopify then falls forward
# to 2026-01. Move to 2026-07 only after the next aura release is live and its handlers are
# validated against 2026-07 payloads (that version removes checkout `id` and order `checkout_id`).
api_version = "2025-10"

  [[webhooks.subscriptions]]
  topics = [ "app/uninstalled" ]
  uri = "/webhooks/app/uninstalled"

  [[webhooks.subscriptions]]
  topics = [ "app/scopes_update" ]
  uri = "/webhooks/app/scopes_update"

[access_scopes]
# WARNING: this one app config serves BOTH stores (production primal500-dev and staging
# aura-ai-shopping-assistant). A push to main deploys it to both via deploy.yml. A new
# scope only takes effect after the merchant approves it by opening the app in each
# store's admin; deploying a config that drops a scope removes it from both stores.
# Learn more at https://shopify.dev/docs/apps/tools/cli/configuration#access_scopes
# Admin API:
#   write_products - for product management
#   write_themes - for theme deployment (CI/CD)
#   write_discounts - create tier-specific discount codes (founder/ambassador/admin)
#   read_own_subscription_contracts / write_own_subscription_contracts - the contracts our
#       own selling plans create (Auto Ship): read, bill, skip/unskip, edit lines, pause,
#       cancel. We hold NO *_all_* subscription scope, so contracts owned by another
#       subscription app are invisible to us; don't add one without a concrete need.
#   read_purchase_options - read selling plans attached to products
#   write_purchase_options - programmatically create Selling Plan Groups from our backend
#   write_publications - programmatically publish products + collections to Online Store
#                        (required by the catalog mirror script — see aura-shopify
#                        backend/scripts/mirror_catalog_to_staging.py publishablePublish step)
#   read_customer_payment_methods - retrieve payment_method_id required to attach a payment
#                                   method to subscription contracts (without it, contracts
#                                   created via subscriptionDraftCommit cannot be billed)
#   read_customers - required for customers/create + customers/update webhooks
#   read_orders - required for orders/create, orders/paid, orders/fulfilled webhooks
#                 (also unlocks order data in subscription analyzer / CAPI attribution)
#   read_inventory - required for inventory_levels/update webhook
#   read_online_store_navigation - navigation menus (Admin API, no caching issues)
#   Broad read-only scopes (added 2026-04-17): analytics, fulfillment orders,
#   content, discounts/price rules, draft orders, files, gift cards, locales,
#   locations, marketing events, products/publications/listings, reports,
#   resource feedbacks, returns, script tags, Shopify Payments
#   (accounts/disputes/payouts), themes, translations. Breadth lets the
#   backend introspect without a new scope deploy (and merchant approval in
#   each store's admin) for every new integration.
#   Broad write scopes (added 2026-05-06): customers, orders, inventory,
#   draft orders, fulfillments (assigned + merchant-managed + third-party),
#   content, files, gift cards, locales, locations, marketing events,
#   price rules, returns, translations. Bundled in one deploy so we stop
#   playing scope-whack-a-mole every time a new admin tooling endpoint
#   needs a write. Deliberately NOT added: write_pixels (JS injection
#   vector), write_script_tags (same), write_customer_payment_methods
#   (PCI-adjacent, no use case), write_resource_feedbacks (niche).
# Storefront API (unauthenticated scopes - inherited by Storefront Access Tokens):
#   unauthenticated_read_content - menus, pages, blog articles
#   unauthenticated_read_product_listings - products, collections, shop info
#   unauthenticated_read_product_tags - product tags for filtering
#   unauthenticated_read_metaobjects - custom content types
#   unauthenticated_read_checkouts - viewing cart/checkout state
#   unauthenticated_write_checkouts - creating carts and checkouts
#   unauthenticated_read_selling_plans - subscription plans
#   unauthenticated_read_product_inventory - stock levels
#
# Metaobjects (added 2026-10-05) for the merchant-editable Build-a-Box catalog:
#   read_metaobjects - catalog reads and the METAOBJECTS_* webhooks that keep its cache fresh
#   write_metaobjects, read/write_metaobject_definitions - catalog provisioning
#     (aura-shopify backend/scripts/provision_box_catalog.py)
scopes = "write_products,write_themes,write_discounts,write_publications,read_online_store_navigation,read_own_subscription_contracts,write_own_subscription_contracts,read_purchase_options,write_purchase_options,read_customer_payment_methods,read_customers,write_customers,read_orders,write_orders,read_inventory,write_inventory,read_shipping,write_shipping,read_analytics,read_assigned_fulfillment_orders,write_assigned_fulfillment_orders,read_content,write_content,read_legal_policies,write_legal_policies,read_discounts,read_draft_orders,write_draft_orders,read_files,write_files,read_fulfillments,write_fulfillments,read_gift_cards,write_gift_cards,read_locales,write_locales,read_locations,write_locations,read_marketing_events,write_marketing_events,read_merchant_managed_fulfillment_orders,write_merchant_managed_fulfillment_orders,read_price_rules,write_price_rules,read_product_listings,read_products,read_publications,read_reports,read_resource_feedbacks,read_returns,write_returns,read_script_tags,read_shopify_payments_accounts,read_shopify_payments_disputes,read_shopify_payments_payouts,read_themes,read_third_party_fulfillment_orders,write_third_party_fulfillment_orders,read_translations,write_translations,read_metaobjects,write_metaobjects,read_metaobject_definitions,write_metaobject_definitions,unauthenticated_read_content,unauthenticated_read_product_listings,unauthenticated_read_product_tags,unauthenticated_read_metaobjects,unauthenticated_read_checkouts,unauthenticated_write_checkouts,unauthenticated_read_selling_plans,unauthenticated_read_product_inventory"

[auth]
redirect_urls = [
  "https://primal-shopify-app.vercel.app/auth/callback",
  "https://primal-shopify-app.vercel.app/auth/shopify/callback"
]

[app_proxy]
url = "https://api.primal500.com/apps/aura"
subpath = "aura"
prefix = "apps"
